[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
# The classic, behaviour-safe set: pyflakes, syntax/statement errors and import sorting.
select = ["E4", "E7", "E9", "F", "I"]
# Style-only rules left off on purpose: rewriting lambdas / renaming `l` is not worth the risk before the demo.
ignore = ["E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
